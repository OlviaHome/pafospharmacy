# SEO agent — manual runs only (stage 2). Schedules come in stage 3.
# This repository is public: logs and artifacts are visible to anyone, so the agent prints only
# status counts (SEO_PUBLIC_LOGS=1) and nothing is uploaded. Search Console data never leaves
# the runner until private history storage exists (stage 3).
#
# Search Console auth (D-067):
#   preferred  keyless Workload Identity Federation — environment variables GCP_WIF_PROVIDER and
#              GSC_SERVICE_ACCOUNT (not secrets); the Google side trusts only this repository's
#              main branch, and the minted token is read-only and lives 15 minutes;
#   fallback   environment secret GSC_SERVICE_ACCOUNT_JSON, used only if WIF is not configured.
name: SEO agent (manual)

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        required: true
        default: critical
        options: [critical, redirects, stats-indexing]

permissions:
  contents: read

concurrency:
  group: seo-agent-${{ github.event.inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Environment "seo-readonly" is limited to the main branch.
    environment: seo-readonly
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # only to mint the GitHub OIDC token for keyless Google auth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Google auth (keyless, read-only)
        id: google
        if: github.event.inputs.job == 'stats-indexing' && vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GSC_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Run SEO agent
        env:
          JOB: ${{ github.event.inputs.job }}
          SEO_PUBLIC_LOGS: "1"
          GSC_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          # Fallback only when keyless auth is not configured; handed only to stats-indexing.
          GSC_SERVICE_ACCOUNT_JSON: ${{ github.event.inputs.job == 'stats-indexing' && vars.GCP_WIF_PROVIDER == '' && secrets.GSC_SERVICE_ACCOUNT_JSON || '' }}
        run: npm run seo -- "$JOB" --trigger manual
